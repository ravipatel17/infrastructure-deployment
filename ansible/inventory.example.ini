# Example inventory only.
#
# The real ansible/inventory.ini file is generated automatically by Terraform.
# Do not put real IP addresses or secrets in this file.

[k3s_nodes]
k3s-node-1 ansible_host=192.168.1.101
k3s-node-2 ansible_host=192.168.1.102
k3s-node-3 ansible_host=192.168.1.103

[k3s_master]
k3s-node-1

[k3s_workers]
k3s-node-2
k3s-node-3

[k3s_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=../id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'